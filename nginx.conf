# Nginx конфигурация для WB Analytics
# Установка: sudo cp nginx.conf /etc/nginx/sites-available/wb-analytics
# Активация: sudo ln -s /etc/nginx/sites-available/wb-analytics /etc/nginx/sites-enabled/
# Перезапуск: sudo systemctl restart nginx

# HTTP -> HTTPS redirect (раскомментируйте если есть SSL)
# server {
#     listen 80;
#     server_name your-domain.ru www.your-domain.ru;
#     return 301 https://$server_name$request_uri;
# }

# Основной сервер
server {
    listen 80;
    server_name _;  # Замените на ваш домен или IP
    
    # Для HTTPS (раскомментируйте если есть SSL сертификат)
    # listen 443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/your-domain.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.ru/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;

    # Frontend (React)
    location / {
        root /home/deploy/wb-analytics/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
        
        # Кэширование статики
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Backend API
    location /api {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Размер запроса (для загрузки изображений)
        client_max_body_size 10M;
    }

    # Health check endpoint
    location /api/health {
        proxy_pass http://localhost:4000/api/health;
        access_log off;
    }

    # Запрет доступа к скрытым файлам
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Запрет доступа к敏感 файлам
    location ~* \.(env|log|sql|backup|dump)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Логи
    access_log /var/log/nginx/wb-analytics.access.log;
    error_log /var/log/nginx/wb-analytics.error.log;
}
